/* ===== v14: glass on every page ===== */
/* shared surfaces */
.cal-bar,.calendar-day,.personal-switch,.seg,.time-track,#event-editor,#ingpicker .party-panel,.wheel-card{border-radius:var(--radius)}
.calendar-day{padding:6px 14px 10px;border:1px solid var(--glass-line);box-shadow:var(--shadow);background:var(--card-solid)}
.calendar-event{border-radius:var(--radius);border:1px solid var(--glass-line);border-left:6px solid;box-shadow:var(--shadow);padding:12px 16px;background:var(--card-solid)}
.calendar-event h3{color:var(--ink)}
.all-day-band{border-left-width:6px}
.person-badge{border-radius:999px;padding:3px 12px;margin:2px 6px 2px 0;background:var(--card-solid);color:var(--ink);font-weight:600;border:1px solid var(--field-line,var(--line))}
.time-track{border:1px solid var(--glass-line);box-shadow:inset 0 1px 3px rgba(24,38,70,.06)}
html:not(.lite) .calendar-day,html:not(.lite) .calendar-event,html:not(.lite) .time-track,html:not(.lite) #event-editor,html:not(.lite) .seg,html:not(.lite) .cal-bar,html:not(.lite) .personal-switch,html:not(.lite) .personal-progress,html:not(.lite) #ingpicker .party-panel,html:not(.lite) .wheel-card{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
html:not(.lite) .calendar-day,html:not(.lite) .calendar-event{background:var(--glass)}
html:not(.lite) .time-track{background:var(--glass)}
.cal-bar{padding:8px 12px;border:1px solid var(--glass-line);background:var(--card-solid);box-shadow:var(--shadow)}
html:not(.lite) .cal-bar{background:var(--glass)}
.cal-bar select{min-width:140px}
.calendar-help{color:var(--mute);margin:8px 2px 14px}
/* calendar form */
#event-editor{padding:20px 22px;max-width:860px}
#event-editor h2{margin:0 0 4px;font-size:24px}
#event-editor label[for]{display:block;font-weight:600;margin:16px 0 4px}
#event-editor label.day-choice{display:inline-block;margin:6px 14px 6px 0;font-weight:400}
#event-editor fieldset{border:1px solid var(--line);border-radius:14px;padding:8px 14px 12px;margin:16px 0 0}
#event-editor legend{font-weight:600;padding:0 6px}
#event-editor input[type=text],#event-editor textarea{width:100%;max-width:100%}
#event-editor .btn{margin-top:18px}
@media (max-width:600px){#event-editor{padding:16px 14px}.calendar-day{padding:4px 10px 8px}}
/* person pages */
.personal-hero{border:1px solid var(--glass-line);border-radius:var(--radius)}
.personal-progress{padding:12px 16px;border-radius:16px;background:rgba(127,140,170,.12)}
.personal-progress .goal-track{height:16px;border-radius:8px}
.personal-stats>div{border:1px solid var(--glass-line);border-radius:var(--radius)}
.personal-aside .card,.personal-main .card,.personal-page .card{border-radius:var(--radius)}
.personal-main .row{min-height:64px;border-radius:14px;padding:8px 10px}
.personal-main .row:hover{background:rgba(127,140,170,.08)}
.chk{min-width:48px;min-height:48px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.chk:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.chk.a,.chk.p{box-shadow:0 3px 10px rgba(46,157,91,.35)}.chk.p{box-shadow:0 3px 10px rgba(233,162,59,.4)}
/* groceries and meals */
.card .row .chk{margin-right:14px}
h2+.card{margin-top:6px}
.mealslot{margin:8px 0}
.mealslot .mi{min-height:48px}
.card>b:first-child{display:block;font-size:20px;margin-bottom:6px}
#ingpicker{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
html.lite #ingpicker{-webkit-backdrop-filter:none;backdrop-filter:none}
#ingpicker .party-panel{border:1px solid var(--glass-line);border-radius:var(--radius);padding:22px 22px;background:var(--card-solid);text-align:left}
html:not(.lite) #ingpicker .party-panel{background:var(--glass)}
#ingpicker .party-panel h2{font-size:24px;margin:0 0 10px}
#ingpicker .party-panel p{font-size:16px}
.ing-row{padding:2px 0}.ing-row label{min-height:48px;display:flex;align-items:center}.ing-row input[type=checkbox]{min-width:26px;min-height:26px}
/* household */
.seg{padding:6px 8px;border:1px solid var(--glass-line);background:var(--card-solid);box-shadow:var(--shadow);margin:0 0 12px}
html:not(.lite) .seg{background:var(--glass)}
.seg .btn{border-radius:999px;min-height:48px}
.card[style*="border-left:6px solid"]{border-left-width:8px!important;box-shadow:var(--shadow),inset 8px 0 18px -12px rgba(217,130,43,.55)}
/* spin */
.wheel-card{padding:26px 16px;border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.wheel-result{font-size:26px;font-weight:700;min-height:44px;color:var(--ink)}
.wheel-stage{filter:drop-shadow(0 12px 22px rgba(24,38,70,.20))}
/* parent */
.parent-page{max-width:1000px}
h2{letter-spacing:.005em}
main#app>h2{margin:28px 0 8px;padding-left:12px;border-left:5px solid var(--focus);border-radius:2px}
.card .row .btn{min-height:48px}
.card input[type=text],.card input:not([type]),.card input[type=number]{min-height:48px}
.day-open,button.event-pill{min-height:48px}
button.event-pill{padding-top:6px;padding-bottom:6px}
.timedchk{display:inline-flex;align-items:center;min-height:48px;margin:0 12px 0 0;white-space:nowrap}.timedchk input{width:24px;height:24px;min-height:0;margin:0 8px 0 0}.saveall{display:flex;align-items:center;flex-wrap:wrap;margin:6px 0 10px}.saveall .btn{min-height:48px;margin-right:14px}#syncstatus{padding:0 16px 6px;font-size:14px;color:var(--mute)}#syncstatus:empty{display:none}html[data-role=kids] *,html[data-role=wall] *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html[data-role] input,html[data-role] textarea,html[data-role] select{-webkit-user-select:text;user-select:text}html[data-role=wall],html[data-role=wall] body{overscroll-behavior:none}.pscroll{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 6px 0 0;border-top:1px solid var(--line);scrollbar-width:thin}.pscroll:focus{outline:2px solid var(--bar);outline-offset:2px}.pscroll-h{font-weight:700;font-size:14px;margin:10px 0 4px;color:var(--mute)}.pscroll .li{padding:3px 0}.pscroll::-webkit-scrollbar{width:8px}.pscroll::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:4px}
.wall{display:flex;flex-direction:column;height:calc(100vh - 24px);min-height:420px;gap:1.2vh;font-size:clamp(14px,1.45vw,23px);color:var(--ink)}
.wall button{font:inherit;color:inherit;text-align:left;cursor:pointer}
.wall h2{font-size:1.05em;margin:0 0 .4em;padding:0;border:0;color:var(--mute);letter-spacing:.02em}
.w-head{display:flex;align-items:center;gap:1.2em;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.5em 1em}
.w-time{display:flex;align-items:baseline;gap:.7em;flex:1;min-width:0}
.w-time .bigclock{font-size:2.6em;font-weight:800;line-height:1}
.w-date{font-size:1.25em;color:var(--mute)}
.w-brand{font-weight:800;font-size:1.2em;color:var(--focus)}
.w-right{display:flex;align-items:center;gap:1em;flex:1;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.w-wx{font-size:1.2em;white-space:nowrap}.w-wx small{color:var(--mute)}
.w-sync{font-size:.95em;font-weight:700;padding:.25em .7em;border-radius:99px;border:2px solid currentColor;white-space:nowrap}
.w-ok{color:#1f7a3a}.w-warn{color:#8a5a00}.w-bad{color:#b3261e}.w-off{color:var(--mute)}
:root[data-theme='dark'] .w-ok{color:#6fdc8c}:root[data-theme='dark'] .w-warn{color:#ffc857}:root[data-theme='dark'] .w-bad{color:#ff8a80}
.w-main{display:grid;grid-template-columns:1.25fr 1fr .85fr;gap:1.2vh 1vw;flex:1;min-height:0}
.w-col{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.7em .9em;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:.2em}
.w-list{display:flex;flex-direction:column;gap:.4em;min-height:0}
.w-cal .w-list:first-of-type{flex:0 1 auto;overflow:auto;max-height:62%}
.w-ev{display:grid;grid-template-columns:auto 1fr;gap:0 .6em;align-items:baseline;background:transparent;border:0;border-left:6px solid #976000;border-radius:6px;padding:.4em .6em;min-height:48px;background:rgba(128,128,128,.10)}
.w-ev b{font-size:1.1em;white-space:nowrap}.w-ev span{font-size:1.15em;font-weight:700;overflow:hidden;text-overflow:ellipsis}.w-ev small{grid-column:2;color:var(--mute);font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w-ev.past b,.w-ev.past span{color:var(--mute);font-weight:600}.w-ev.up{min-height:44px}
.w-empty,.w-note{color:var(--mute);font-size:.95em;padding:.3em .2em}
.w-more,.w-link{background:transparent;border:2px solid var(--line);border-radius:12px;padding:.5em .9em;min-height:48px;color:var(--focus)}
.w-kid{display:flex;flex-direction:column;gap:.3em;background:rgba(128,128,128,.10);border:0;border-radius:14px;padding:.55em .8em;min-height:48px}
.w-kh{display:flex;align-items:center;gap:.6em}.w-kh b{font-size:1.25em;flex:1}
.w-av{display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border:3px solid;border-radius:50%;font-size:1.1em}
.w-pts{font-weight:700}.w-frac{font-weight:800;font-size:1.15em}
.w-bar{display:block;height:.7em;background:rgba(128,128,128,.25);border-radius:99px;overflow:hidden}.w-bar i{display:block;height:100%;border-radius:99px}
.w-tasks{font-size:.95em;line-height:1.4}
.w-pend{display:block;width:100%;background:rgba(255,200,60,.18);border:0;border-radius:10px;padding:.5em .7em;min-height:48px}
.w-side{background:transparent;border:0;padding:0;gap:1.2vh;overflow:visible}
.w-box{display:block;flex:1;min-height:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.6em .9em}
.w-big{font-size:1.5em;font-weight:800;line-height:1.15}.w-small{font-size:.98em;line-height:1.4}
.w-foot{display:flex;justify-content:flex-end}.w-foot .w-link{padding:.25em .9em;min-height:44px;font-size:.9em}
.wall button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
html[data-role=wall] main#app{max-width:none;padding:10px 14px 0 6px;margin:0}
@media (max-width:820px){.w-main{grid-template-columns:1fr 1fr}.w-side{grid-column:1 / -1;flex-direction:row}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
html[data-role=wall].lite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html.wallmode nav,html.wallmode #clock,html.wallmode #savestatus,html.wallmode #syncstatus{display:none}
.w-brand{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* ===== v31 ===== */
html[data-tod=morning]{--tod1:#ffe7d1;--tod2:#fcf0f3;--nn1:#c2410c;--nn2:#b45309}
html[data-tod=day]{--tod1:#dcebff;--tod2:#eef4fd;--nn1:#1d4ed8;--nn2:#4338ca}
html[data-tod=evening]{--tod1:#ffdccb;--tod2:#ece3f7;--nn1:#7c2d92;--nn2:#be185d}
html[data-tod=night]{--tod1:#e0e4f7;--tod2:#e6e5f6;--nn1:#1e1b4b;--nn2:#312e81}
@media (prefers-color-scheme:dark){
html:not([data-theme="light"])[data-tod=morning]{--tod1:#35261f;--tod2:#15202b}
html:not([data-theme="light"])[data-tod=day]{--tod1:#123049;--tod2:#101d2a}
html:not([data-theme="light"])[data-tod=evening]{--tod1:#3a2342;--tod2:#1a1b2b}

html[data-theme="dark"][data-tod=morning]{--tod1:#35261f;--tod2:#15202b}

html[data-theme="dark"][data-tod=evening]{--tod1:#3a2342;--tod2:#1a1b2b}
html[data-theme="dark"][data-tod=night]{--tod1:#0b1224;--tod2:#0e1622}
html[data-tod] body{background-image:linear-gradient(180deg,var(--tod1) 0%,var(--tod2) 55%,var(--bg) 100%);background-attachment:fixed;background-repeat:no-repeat;min-height:100vh}
html.lite[data-tod] body{background-attachment:scroll;background-size:100% 100vh}
.btn,nav button,.tagbtn,.ftb-av,.w-ev,.w-box,.w-kid,.w-pend,.cd,.nn-hero,.sf-h,.sf-seg button,.sf-mic,.day-open{transition:transform .12s ease}
.btn:active,nav button:active,.tagbtn:active,.ftb-av:active,.w-ev:active,.w-box:active,.w-kid:active,.w-pend:active,.cd:active,.nn-hero:active,.sf-h:active,.sf-seg button:active,.sf-mic:active,.day-open:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.btn,nav button,.tagbtn,.ftb-av,.w-ev,.w-box,.w-kid,.w-pend,.cd,.nn-hero,.sf-h,.sf-seg button,.sf-mic,.day-open{transition:none}.btn:active,nav button:active,.tagbtn:active,.ftb-av:active,.w-ev:active,.w-box:active,.w-kid:active,.w-pend:active,.cd:active,.nn-hero:active,.sf-h:active,.sf-seg button:active,.sf-mic:active,.day-open:active{transform:none}}
html:not(.lite) .card,html:not(.lite) .cd{box-shadow:0 1px 2px rgba(25,35,70,.06),0 6px 14px rgba(25,35,70,.08),0 16px 30px rgba(25,35,70,.05)}
.nn-hero{display:block;width:100%;text-align:left;font:inherit;border:0;cursor:pointer;color:#fff;margin:0 0 14px;padding:18px 20px;border-radius:22px;background:#3b5bdb;background-image:linear-gradient(135deg,var(--nn1,#1d4ed8),var(--nn2,#4338ca));box-shadow:0 2px 4px rgba(20,25,60,.18),0 10px 24px rgba(20,25,60,.22)}
.nn-hero span{display:block}
.nn-hero .nn-k{font-size:14px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase}
.nn-hero .nn-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#fff;margin-right:8px}
.nn-hero .nn-t{font-size:28px;font-weight:bold;line-height:1.15;margin:6px 0 2px}
.nn-hero .nn-c{font-size:36px;font-weight:bold;line-height:1.1;margin:2px 0 8px}
.nn-hero .nn-m{font-size:17px;margin:4px 0 8px}

.nn-hero .nn-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.3);margin:4px 0 10px;overflow:hidden}
.nn-hero .nn-bar i{display:block;height:100%;background:#fff;border-radius:4px}
.nn-hero.nn-empty .nn-t{font-size:24px}
.nn-hero:focus{outline:3px solid #fff;outline-offset:-6px}
.nn-wall{position:relative;flex:0 0 auto;margin:0;padding:1vh 1.6vw;border-radius:16px;cursor:default}
.nn-wall .nn-k{font-size:clamp(11px,1vw,16px)}
.nn-wall .nn-t{font-size:clamp(18px,2.1vw,36px);margin:.1vh 0;padding-right:26vw}
.nn-wall .nn-c{position:absolute;right:1.6vw;top:50%;margin:-.7em 0 0;font-size:clamp(20px,2.6vw,44px);text-align:right}
.nn-wall .nn-m{display:inline-block;margin:.2vh 1vw .2vh 0;font-size:clamp(12px,1.2vw,20px)}
.nn-wall .nn-pills{display:inline;margin:0}
.nn-wall .nn-pill{font-size:clamp(11px,1.1vw,18px);padding:.3vh .9vw;margin:0 .6vw 0 0}
.nn-wall .nn-then,.nn-wall .nn-bar{display:none}
#event-editor .sf-ess{margin:4px 0 10px}
#event-editor .sf-trow{display:block;position:relative}
#event-editor .sf-trow input{width:100%;font-size:20px;min-height:54px;padding-right:64px}
#event-editor .sf-mic{position:absolute;right:4px;top:4px;width:48px;height:48px;min-height:48px;border-radius:50%;border:0;background:#3b5bdb;color:#fff;font-size:22px;cursor:pointer;padding:0}
#event-editor .sf-mic.sf-live{background:#c0392b}
@media (prefers-reduced-motion:no-preference){#event-editor .sf-mic.sf-live{animation:sfpulse 1.2s ease-in-out infinite}}
@keyframes sfpulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}100%{box-shadow:0 0 0 16px rgba(192,57,43,0)}}
#event-editor .sf-heard{font-size:15px;color:var(--mute);margin:6px 0 2px}
#event-editor .sf-heard:empty{display:none}
#event-editor .sf-seg{margin:12px 0 4px;font-size:0}

#event-editor .sf-seg button:first-child{border-radius:14px 0 0 14px}
#event-editor .sf-seg button:last-child{border-radius:0 14px 14px 0;border-left-width:0}

#event-editor .sf-who label.day-choice{position:relative;display:inline-block;margin:0 8px 8px 0;padding:12px 18px;min-height:48px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}

/* Phase 1: glanceable wall photo frame */
#idle{isolation:isolate;background-position:center;background-size:cover}.idle-date{margin-top:8px}.idle-glance>*+*{margin-top:10px}
#idle::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(0deg,rgba(0,0,0,.72),transparent 58%);z-index:-1;pointer-events:none}
.idle-glance{position:absolute;top:max(22px,env(safe-area-inset-top));right:24px;display:flex;flex-direction:column;align-items:flex-end;max-width:min(420px,80vw)}
.idle-pill{background:rgba(15,27,45,.68);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:18px;padding:12px 16px;box-shadow:0 4px 22px #0004;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:18px;line-height:1.35;text-align:right}

/* v31.4: voice bridge for the Android (Fire tablet) wrapper. Only active when the wrapper provides window.FHNative
   and the browser has no speech recognition of its own. Presents the same interface the page already uses. */
(function(){
  try{
    if(window.SpeechRecognition||window.webkitSpeechRecognition)return;
    var N=window.FHNative;
    if(!N||typeof N.isAvailable!=="function"||!N.isAvailable())return;
    var cur=null;
    function Shim(){this.lang="en-US";this.interimResults=false;this.continuous=false;this.maxAlternatives=1;this.onresult=null;this.onerror=null;this.onend=null;}
    Shim.prototype.start=function(){if(cur&&cur!==this){var o=cur;cur=null;try{if(o.onend)o.onend();}catch(e){}}cur=this;N.start(this.lang||"en-US");};
    Shim.prototype.stop=function(){try{N.stop();}catch(e){}};
    Shim.prototype.abort=function(){try{N.cancel();}catch(e){}};
    window.__fhSpeech=function(kind,text){
      var r=cur;if(!r)return;
      try{
        if(kind==="partial"||kind==="final"){if(r.onresult)r.onresult({results:[[{transcript:String(text||"")}]]});}
        else if(kind==="error"){if(r.onerror)r.onerror({error:String(text||"other")});}
        else if(kind==="end"){cur=null;if(r.onend)r.onend();}
      }catch(e){}
    };
    window.webkitSpeechRecognition=Shim;
  }catch(e){}
})();
</script>

function p2MergeBlob(k,local,remote){
 try{
  if(k==='fridgeNotes'||k==='bounties'){
   if(!Array.isArray(remote)||!Array.isArray(local))return remote;
   var out=[],seen={},li={};
   local.forEach(function(x){if(x&&x.id)li[x.id]=x;});
   remote.forEach(function(r){var l=li[r&&r.id],m=r;seen[r&&r.id]=1;
    if(l&&k==='fridgeNotes'){if((l.read&&!r.read)||(l.archived&&!r.archived)){m=JSON.parse(JSON.stringify(r));if(l.read)m.read=true;if(l.archived)m.archived=true;}}
    else if(l&&k==='bounties'){var lu=String(l.u||''),ru=String(r.u||'');if(lu>ru||(lu===ru&&l.status!==r.status&&(l.status==='removed'||(l.status==='claimed'&&r.status==='open'))))m=l;}
    out.push(m);});
   local.forEach(function(l){if(l&&l.id&&!seen[l.id])out.push(l);});
   var cap=k==='fridgeNotes'?60:100;if(out.length>cap)out=out.slice(-cap);
   return out;
  }
  if(k==='cosmetics'){
   if(!local||typeof local!=='object'||!remote||typeof remote!=='object')return remote;
   var o2=JSON.parse(JSON.stringify(remote));
   Object.keys(local).forEach(function(id){var l=local[id];if(!l||!Array.isArray(l.owned))return;
    var r=o2[id]=o2[id]||{owned:[],equipped:{}};if(!Array.isArray(r.owned))r.owned=[];if(!r.equipped||typeof r.equipped!=='object')r.equipped={};
    l.owned.forEach(function(x){if(r.owned.indexOf(x)<0&&cosmeticItem(x))r.owned.push(x);});
    var le=l.equipped||{};Object.keys(le).forEach(function(t){if(r.equipped[t]===undefined&&(le[t]===''||r.owned.indexOf(le[t])>=0))r.equipped[t]=le[t];});});
   var pend=sync.cosPending||{};
   Object.keys(pend).forEach(function(key){var q=key.split('|'),rr=remote[q[0]];
    if(rr&&Array.isArray(rr.owned)&&rr.owned.indexOf(q[1])>=0){S.stars=S.stars||{};S.stars[q[0]]=(Number(S.stars[q[0]])||0)+pend[key];delete pend[key];sync.notice='Two parents bought the same item at the same time. The points were refunded once.';}});
   return o2;
  }
 }catch(e){}
 return remote;
}
function p2ClearPending(json){try{var o=JSON.parse(json).v||{},pend=sync.cosPending||{};Object.keys(pend).forEach(function(key){var q=key.split('|');if(o[q[0]]&&Array.isArray(o[q[0]].owned)&&o[q[0]].owned.indexOf(q[1])>=0)delete pend[key];});}catch(e){}}
function p2Reconcile(){

}

function nnMinutes(t){var a=String(t||'').split(':');return (+a[0])*60+(+a[1]||0);}

function nowNextHero(wall){
  var n=new Date(),ds=today(),nowT=p2(n.getHours())+':'+p2(n.getMinutes()),nm=n.getHours()*60+n.getMinutes(),tom=fd(addD(n,1));
  var list=[];try{list=eventsAhead(ds,14).filter(function(e){return e.d>ds||!e.m||(e.end||e.m)>=nowT;});}catch(x){}
  var now=null,next=null,then=null,i;
  for(i=0;i<list.length;i++){var e=list[i];if(!now&&e.d===ds&&e.m&&e.end&&e.m<=nowT&&e.end>nowT){now=e;continue;}
    if(e.d>ds||(e.d===ds&&e.m>nowT)){if(!next)next=e;else if(!then){then=e;}}}
  if(!next){for(i=0;i<list.length;i++){if(list[i]!==now&&list[i].d===ds&&!list[i].m){next=list[i];break;}}}
  var cls='nn-hero'+(wall?' nn-wall':''),h='';
  var tag=wall?'div':'button';
  var attrs=wall?" id='nnhero'":" id='nnhero' data-a='go' data-v='cal' type='button'";
  var main=now||next;
  if(!main){return '<'+tag+" class='"+cls+" nn-empty'"+attrs+"><span class='nn-k'>Nothing planned</span><span class='nn-t'>A free stretch — enjoy it!</span><span class='nn-m'>Tap to open the calendar</span></"+tag+'>';}
  var label,count,bar='';
  if(now){label='Happening now';var left=nnMinutes(now.end)-nm;count=left<=1?'ends in a minute':'ends in '+(left<60?left+' min':Math.floor(left/60)+' h'+(left%60?' '+(left%60)+' min':''));var st=nnMinutes(now.m),en=nnMinutes(now.end),pc=en>st?Math.max(0,Math.min(100,Math.round((nm-st)/(en-st)*100))):0;bar="<span class='nn-bar' aria-hidden='true'><i style='width:"+pc+"%'></i></span>";}
  else{
    label='Up next';
    if(main.d===ds&&main.m)count=nnLeft(nnMinutes(main.m)-nm);
    else if(main.d===ds)count='all day today';
    else if(main.d===tom)count='tomorrow'+(main.m?' · '+niceTime(main.m):'');
    else count=niceDate(main.d)+(main.m?' · '+niceTime(main.m):'');
  }
  h+="<span class='nn-k'><i class='nn-dot' aria-hidden='true'></i>"+label+"</span><span class='nn-t'>"+kindIcon(main.kind)+esc(main.t)+"</span><span class='nn-c'>"+esc(count)+"</span>"+bar;
  var pills='';
  if(main.m)pills+="<span class='nn-pill'>🕓 "+esc(niceTime(main.m))+(main.end?'–'+esc(niceTime(main.end)):'')+"</span>";
  if(main.driver&&person(main.driver))pills+="<span class='nn-pill'>🚗 "+esc(person(main.driver).n)+" driving</span>";
  var lb=main.d===ds?leaveByText(main):'';if(lb)pills+="<span class='nn-pill'>"+esc(lb.replace(/^🚗 /,'⏰ '))+"</span>";
  h+="<span class='nn-m'>"+nnAvatars(main)+nnLine(main)+"</span>"+(pills?"<span class='nn-pills'>"+pills+"</span>":'');
  var after=now?next:then;
  if(after)h+="<span class='nn-then'>"+(now?'Next':'Then')+": <b>"+esc(after.t)+"</b> · "+esc(after.d===ds?niceTime(after.m):(after.d===tom?'tomorrow':niceDate(after.d))+(after.m?' '+niceTime(after.m):''))+"</span>";
  return '<'+tag+" class='"+cls+"'"+attrs+">"+h+'</'+tag+'>';
}
