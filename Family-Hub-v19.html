html{scroll-padding-top:env(safe-area-inset-top,0px)}

#themebtn{min-width:52px;min-height:48px;font-size:22px;line-height:1}
main{padding:16px;max-width:1100px;margin:0 auto}
h1{font-size:30px;margin:4px 0 2px}h2{font-size:22px;margin:18px 0 8px}

body{padding-left:92px}

.btn{min-height:48px}.btn.g{background:#207544}.btn.n{background:#53657a;color:#fff}

  if(c==="eventRequests"){return ["add","edit","delete"].indexOf(o.kind)>=0&&typeof o.by==="string";}
  if(c==="groc"){return syncStr(o.t,300)&&(o.s===undefined||syncStr(o.s,100));}
  if(c==="req"){return syncStr(o.p,100)&&syncStr(o.r,100);}
  if(c==="ledger"){return syncStr(o.p,100)&&typeof o.d==="number"&&isFinite(o.d)&&Math.abs(o.d)<=100000;}
  if(c==="done"){return syncStr(o.v,20)&&!!syncDoneKey(id);}

  if(c==="cfg"){
    var v=o.v;
    if(id==="members")return validMembers(v);
    if(id==="weather")return v===null||(v&&typeof v==="object"&&isFinite(v.lat)&&isFinite(v.lon)&&typeof v.name==="string"&&(v.units==="c"||v.units==="f"));
    if(id==="rewards")return Array.isArray(v)&&v.length<=100&&v.every(function(r){return r&&typeof r.id==="string"&&typeof r.n==="string"&&isFinite(r.c);});
    if(id==="goal")return v===null||(v&&typeof v==="object"&&!Array.isArray(v));
    if(id.indexOf("tasks_")===0)return Array.isArray(v)&&v.length<=300&&v.every(function(t){return t&&typeof t==="object"&&typeof t.id==="string"&&typeof t.t==="string";});
    return false;
  }
  return false;
}
function syncApplyItem(c,id,obj){
  var key={events:"events",eventRequests:"eventRequests",groc:"groc",req:"req"}[c];
  if(key){var l=(S[key]||[]).slice(),i=-1,n;for(n=0;n<l.length;n++)if(l[n]&&l[n].id===id){i=n;break;}if(i>=0)l[i]=obj;else l.push(obj);S[key]=l;return;}

  if(c==="cfg"){if(id==="members"){S.members=obj.v;normalizeMembers();}else if(id.indexOf("tasks_")===0){S.tasks[id.slice(6)]=obj.v;}else S[id]=obj.v;return;}
}
function syncRemoveItem(c,id){
  var key={events:"events",eventRequests:"eventRequests",groc:"groc",req:"req"}[c];
  if(key){S[key]=(S[key]||[]).filter(function(x){return !(x&&x.id===id);});return;}
  if(c==="done"){var k=syncDoneKey(id);if(k){delete S.done[k];if(S.pendingPoints)delete S.pendingPoints[k];}return;}
  if(c==="meals"){if(S.meals)delete S.meals[id];return;}

}
function syncApplyDoc(c,id,rd){
  if(!rd||typeof rd.rev!=="number"||!isFinite(rd.rev)||!sync.known[c])return false;
  var kn=sync.known[c][id];if(kn&&kn.rev>=rd.rev)return false;
  if(rd.deleted){
    if(c==="ledger"||c==="cfg"){sync.known[c][id]={rev:rd.rev,json:null,deleted:true};return false;}
    syncRemoveItem(c,id);sync.known[c][id]={rev:rd.rev,json:null,deleted:true};return true;
  }
  if(typeof rd.json!=="string"||rd.json.length>20000)return false;
  var obj=null;try{obj=JSON.parse(rd.json);}catch(e){}
  if(!syncValidItem(c,obj,id))return false;
  if(c==="ledger"){
    var mine=sync.ledger.some(function(x){return x.id===id;});
    sync.known[c][id]={rev:rd.rev,json:null,deleted:false};
    if(mine){sync.ledger=sync.ledger.filter(function(x){return x.id!==id;});return false;}
    S.stars=S.stars||{};S.stars[obj.p]=(Number(S.stars[obj.p])||0)+obj.d;sync.starsSynced[obj.p]=(Number(sync.starsSynced[obj.p])||0)+obj.d;
    return true;
  }
  syncApplyItem(c,id,obj);sync.known[c][id]={rev:rd.rev,json:rd.json,deleted:false};return true;
}
function syncLedgerScan(){
  var ch=false;
  Object.keys(S.stars||{}).forEach(function(pid){
    if(!/^[A-Za-z0-9_-]{1,100}$/.test(pid))return;
    var cur=Number(S.stars[pid])||0,was=Number(sync.starsSynced[pid])||0;
    if(cur!==was){sync.ledger.push({id:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),p:pid,d:cur-was});sync.starsSynced[pid]=cur;ch=true;}
  });
  return ch;
}
function syncDiff(){
  var jobs=[];
  SYNC_COLLS.forEach(function(c){
    var list=syncList(c),k=sync.known[c],seen={};
    list.forEach(function(it){
      if(!it||typeof it.id!=="string"||!SYNC_ID_RE.test(it.id))return;seen[it.id]=1;
      var js=JSON.stringify(it),kn=k[it.id];
      if(js.length>20000)return;
      if(c==="ledger"){if(!kn)jobs.push({c:c,id:it.id,json:js,del:false,base:0});return;}
      if(!kn||kn.deleted||kn.json!==js)jobs.push({c:c,id:it.id,json:js,del:false,base:kn?kn.rev:0});
    });
    if(c==="ledger"||c==="cfg")return;
    Object.keys(k).forEach(function(id){var kn=k[id];if(!seen[id]&&!kn.deleted&&syncInWindow(c,id))jobs.push({c:c,id:id,json:kn.json||"",del:true,base:kn.rev});});
  });

}
function syncSchedule(ms){if(sync.timer)clearTimeout(sync.timer);sync.timer=setTimeout(function(){sync.timer=null;syncPush();},ms||400);}
function syncFast(){window.FH_FAST_UNTIL=Date.now()+60000;}
function syncPush(){
  if(!sync.on||!sync.adapter||sync.busy||!sync.user||!sync.ready)return;
  if(initialDataProblem||storageConflict)return;
  if(sync.starsInit)syncLedgerScan();
  if(syncEnsureIds()){sync.applying=true;try{save();}finally{sync.applying=false;}}
  var jobs=syncDiff();
  if(!jobs.length){syncStore();if(sync.state!=="paused")syncSetState("ok");return;}
  var dels=jobs.filter(function(j){return j.del;}).length,knownCount=0;
  SYNC_COLLS.forEach(function(c){if(c==="ledger")return;Object.keys(sync.known[c]).forEach(function(id){if(!sync.known[c][id].deleted)knownCount++;});});
  if(!sync.allow&&dels>=3&&dels*2>=knownCount){sync.guard=true;sync.guardInfo=dels+" of "+knownCount+" shared items would be deleted for everyone.";syncSetState("paused");return;}
  sync.guard=false;sync.busy=true;syncSetState("sending");syncFast();
  var i=0,conflicts=0;
  function done(){
    sync.busy=false;sync.allow=false;syncStore();
    if(conflicts){sync.notice="Another device changed "+conflicts+" item"+(conflicts===1?"":"s")+" at the same time. The newer version was kept.";syncAfterRemote();}
    syncSetState("ok");
    if(syncDiff().length)syncSchedule(300);
  }
  function next(){
    if(i>=jobs.length){done();return;}
    var j=jobs[i++];
    sync.adapter.put(j.c,j.id,j.base,j.json,j.del).then(function(r){
      if(r&&r.ok){
        sync.known[j.c][j.id]={rev:r.rev,json:(j.del||j.c==="ledger")?null:j.json,deleted:!!j.del};
        if(j.c==="ledger")sync.ledger=sync.ledger.filter(function(x){return x.id!==j.id;});
      }else if(r&&r.remote){if(syncApplyDoc(j.c,j.id,r.remote))conflicts++;}
      else{delete sync.known[j.c][j.id];}
      next();
    },function(err){sync.busy=false;syncStore();syncSetState(err&&err.code==="perm"?"error":"offline",err);syncSchedule(15000);});
  }
  next();
}
function syncOnDocs(docs,cursor){
  var changed=false;
  if(!sync.starsInit){
    var hasL=docs.some(function(d){return d.c==="ledger"&&!d.deleted;});
    if(hasL){var any=false;Object.keys(S.stars||{}).forEach(function(k){if(S.stars[k])any=true;});if(any)sync.notice="Points on this device were replaced by the family's shared points.";S.stars={};sync.starsSynced={};changed=true;}
    sync.starsInit=true;
  }
  docs.forEach(function(d){if(syncApplyDoc(d.c,d.id,d))changed=true;});
  if(cursor)sync.cursor=cursor;
  sync.ready=true;
  if(changed){syncFast();syncAfterRemote();}else syncStore();
  if(sync.state==="connecting"||sync.state==="offline"||sync.state==="error")syncSetState("ok");
  syncSchedule(80);
}
window.syncAfterSave=function(){if(sync.on&&!sync.applying)syncSchedule(400);};

function syncSetState(s,detail){
  sync.state=s;sync.detail=detail?String(detail.message||detail):"";
  if(s==="ok")sync.last=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  var el=document.getElementById("syncstatus");if(!el)return;
  var t="";
  if(!sync.on)t="";
  else if(s==="connecting"){t="☁ Connecting…";clearTimeout(sync.slowT);sync.slowT=setTimeout(function(){var e2=document.getElementById("syncstatus");if(sync.on&&sync.state==="connecting"&&e2)e2.textContent="☁ Still connecting after 20 seconds. Check Firestore rules are published and the database exists (Parent > Family sync shows details).";},20000);}
  else if(s==="ok")t="☁ Family data synced "+sync.last;
  else if(s==="sending")t="☁ Sending changes…";
  else if(s==="offline")t="☁ Offline. Changes will send when the connection returns.";
  else if(s==="signedout")t="☁ Sign in to share family data (Parent > Family sync).";
  else if(s==="nosdk")t="☁ Could not load the sync library. Check Wi-Fi.";
  else if(s==="paused")t="☁ Sync paused. A parent needs to review it (Parent > Family sync).";
  else if(s==="error")t="☁ Sync problem. See Parent > Family sync.";
  el.textContent=t;
}

    return new Promise(function(res,rej){
      var t=setTimeout(function(){if(!done){done=true;if(ctl)ctl.abort();rej(new Error("no answer in 12 seconds"));}},12000);
      var o={method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined};
      if(tok)o.headers.Authorization="Bearer "+tok;if(ctl)o.signal=ctl.signal;
      fetch(url,o).then(function(r){return r.text().then(function(x){if(done)return;done=true;clearTimeout(t);res({status:r.status,text:x});});}).catch(function(e){if(done)return;done=true;clearTimeout(t);rej(e);});
    });

  out("1/3 Checking sign-in service…");

function hhNextDate(x){

  if(['pendingPoints','awards','submissions','returnNotes'].some(function(m){return s[m]&&Object.keys(s[m]).some(function(k){return !keyOk(k);});}))return false;
  if(s.pendingPoints&&Object.keys(s.pendingPoints).some(function(k){return !finiteNumber(s.pendingPoints[k])||s.pendingPoints[k]<0||s.pendingPoints[k]>2000||Math.floor(s.pendingPoints[k]*2)!==s.pendingPoints[k]*2;}))return false;
  if(s.submissions&&Object.keys(s.submissions).some(function(k){return !obj(s.submissions[k]);}))return false;
  if(s.goal&&s.goal.by&&(!obj(s.goal.by)||Object.keys(s.goal.by).some(function(id){return !person(id)||typeof s.goal.by[id]!=='number'||!isFinite(s.goal.by[id]);})))return false;
  if(s.pointNews&&Object.keys(s.pointNews).some(function(p){return !person(p)||!obj(s.pointNews[p])||!finiteNumber(s.pointNews[p].points);}))return false;
  if(s.awards&&Object.keys(s.awards).some(function(k){var a=s.awards[k];return !obj(a)||!person(a.person)||!text(a.title)||!finiteNumber(a.points)||!finiteNumber(a.full)||!text(a.approvedAt);}))return false;
  if(s.approvalReversals&&(!Array.isArray(s.approvalReversals)||s.approvalReversals.some(function(r){return !obj(r)||!text(r.key)||!text(r.reversedAt)||!finiteNumber(r.goalPointsRemoved)||!obj(r.award)||!person(r.award.person)||!finiteNumber(r.award.points);})))return false;
  return true;
}
function restorePanelHtml(){return "<h2>Restore a backup</h2><div class='card'><p>Choose a Family Hub JSON backup, or paste its text. Review the confirmation before replacing this device’s data. Photos are left unchanged.</p><label for='restorefile'>Backup file</label><input id='restorefile' type='file' accept='.json,application/json'><label for='restoretext'>Backup text</label><textarea id='restoretext' rows='5' style='width:100%'></textarea><button class='btn r' data-a='nxrestore'>Review and restore</button><button class='btn n' data-a='nxloadrecovery'>Load previous recovery copy</button><p class='note'>A recovery copy of the current data is saved on this device before replacement.</p></div>";}
function restoreBackupText(){
  if(!unlocked)return;
  var text=v('restoretext');if(text.length>3000000){alert('This backup is too large.');return;}
  try{
    var wrapper=JSON.parse(text);
    if(wrapper.app!=='Family Hub'||wrapper.formatVersion!==1||!validateHubBackup(wrapper.data))throw Error('invalid');
    var data=wrapper.data,count=0;(data.members||defaultMembers).forEach(function(p){count+=data.tasks[p.id].length;});
    if(!confirm('Replace this device’s data with '+data.events.length+' calendar series and '+count+' tasks from this backup? Current data will be kept as a recovery copy.'))return;
    var disk=localStorage.getItem(KEY),parsed=null;try{parsed=disk?JSON.parse(disk):null;}catch(ignore){}
    if(storageConflict||(parsed&&(Number(parsed._rev)||0)!==baseRevision)){showStorageConflict();return;}
    localStorage.setItem(KEY+'-recovery',JSON.stringify({app:'Family Hub',formatVersion:1,exportedAt:new Date().toISOString(),data:S}));
    var previous=S;S=data;initialDataProblem=false;normalizeHub();initializeChorePoints();
    if(!save()){S=previous;normalizeMembers();return;}
    unlocked=false;view='home';taskEdit=null;eventEdit='';render();statusMessage('Backup restored. Parent area is locked.');
  }catch(x){alert('Could not restore this file. Use a valid Family Hub backup with supported data and positive reward prices.');}
}
function effectiveTheme(){var t=personTheme()||S.theme||'auto';if(t==='light'||t==='dark')return t;return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
function applyTheme(){applyLite();var theme=personTheme()||S.theme||'auto';if(theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',theme);var tb=document.getElementById('themebtn');if(tb){var dk=effectiveTheme()==='dark';tb.textContent=dk?'☀️':'🌙';tb.setAttribute('aria-label',dk?'Switch to light mode':'Switch to dark mode');}}

  var fm=/^food-(likes|dislikes)-(.+)$/.exec(e.target.id||'');
  if(fm&&person(fm[2])){var snapF=JSON.stringify(S);S.foodPrefs=S.foodPrefs||{};var fp=S.foodPrefs[fm[2]]=S.foodPrefs[fm[2]]||{likes:'',dislikes:''};fp[fm[1]]=e.target.value.slice(0,300);if(!save()){rollbackTo(snapF);render();}return;}
  if(e.target.id==='calview'){cv=e.target.value;storeCalendarView();render();var cvel=document.getElementById('calview');if(cvel)cvel.focus();return;}
  if(e.target.id==='calwho'){calP=e.target.value;render();var cwel=document.getElementById('calwho');if(cwel)cwel.focus();return;}
  if(e.target.id==='wxunits'&&unlocked){if(S.weather){S.weather.units=e.target.value==='c'?'c':'f';save();render();wxRefresh(true);}return;}
  if(e.target.id&&e.target.id.indexOf('cust-')===0){custChange(e);return;}
  if(e.target.id==='hubtheme'&&unlocked){S.theme=e.target.value;applyTheme();save();}

  if(e.target.id==='restorefile'&&unlocked&&e.target.files[0]){

    var reader=new FileReader();reader.onload=function(){var box=document.getElementById('restoretext');if(box)box.value=reader.result;};reader.readAsText(e.target.files[0]);
  }
});



function updateNowLines(){var lines=document.querySelectorAll('.now-rule'),n=new Date(),m=n.getHours()*60+n.getMinutes();for(var i=0;i<lines.length;i++){var top=m-Number(lines[i].getAttribute('data-low'));lines[i].style.top=top+'px';lines[i].style.display=top>=0&&top<lines[i].parentNode.clientHeight?'block':'none';}}
function loadCalendarView(){try{var value=localStorage.getItem('familyhub-calendar-view');if(['two','timeline','day','three','week','month','list'].indexOf(value)>=0)return value;}catch(ignore){}return window.innerWidth&&window.innerWidth<600?'list':'two';}
function storeCalendarView(){try{localStorage.setItem('familyhub-calendar-view',cv);}catch(ignore){}}
function dayHeading(ds){return (ds===today()?'Today · ':ds===fd(addD(localDate(today()),1))?'Tomorrow · ':'')+niceDate(ds);}
function personBadges(e){var ids=attendees(e);return '<div class="calendar-people">'+(ids.length?ids.map(function(id){var p=person(id);return p?'<span class="person-badge" style="border-left-color:'+p.c+'">'+esc(p.e)+' '+esc(p.n)+'</span>':'';}).join(''):'<span class="person-badge" style="border-left-color:#976000">Whole family</span>')+'</div>';}
function minuteOf(t){var a=t.split(':');return +a[0]*60+(+a[1]);}
function overlapNames(e,events){if(!e.m||!e.end)return [];return events.filter(function(x){return x!==e&&x.m&&x.end&&minuteOf(x.m)<endMin(e)&&minuteOf(e.m)<endMin(x);}).map(function(x){return x.t;});}
function calendarEvent(e,overlaps,conf){
  var now=new Date(),past=e.d<today()||(e.d===today()&&e.end&&!e.endNext&&minuteOf(e.end)<=now.getHours()*60+now.getMinutes());
  return '<article class="calendar-event'+(past?' event-past':'')+'" style="border-left-color:'+eventColor(e)+'"><b>'+niceTime(e.m)+(e.end?' – '+niceTime(e.end)+(e.endNext?' (next day)':''):'')+'</b><h3>'+kindIcon(e.kind)+esc(e.t)+(e.cont?' <small>(continued from last night)</small>':'')+'</h3>'+personBadges(e)+(e.through?'<p class="note">'+niceDate(e.startDate||e.d)+' – '+niceDate(e.through)+'</p>':'')+(e.driver?'<div class="note">Responsible: '+esc(person(e.driver)?person(e.driver).n:e.driver)+'</div>':'')+(e.loc?'<div class="note">📍 '+esc(e.loc)+'</div>':'')+(leaveByText(e)?'<div class="note"><b>'+esc(leaveByText(e))+'</b></div>':'')+((e.list&&e.list.length)?'<div class="note">🎒 Bring: '+e.list.map(esc).join(', ')+'</div>':'')+(needsDriver(e)?'<p class="event-warning event-warn2">No driver chosen yet</p>':'')+(conf&&conf.length?'<p class="event-warning event-warn2">'+conf.map(function(c){return esc(c.who)+' is also needed at '+esc(c.title);}).join('. ')+'</p>':'')+(overlaps&&overlaps.length?'<p class="event-warning">Same time as: '+esc(overlaps.join(', '))+'</p>':'')+'<button class="btn n" data-a="nxevent" data-id="'+e.series+'" data-day="'+(e.origin||e.d)+'">Details / edit</button></article>';
}
function scheduledTasks(ds){var tasks=[];P.forEach(function(p){if(calP&&calP!==p.id)return;dueTasks(p.id,ds).forEach(function(t){tasks.push({p:p,t:t});});});return tasks.length?'<details class="card"><summary style="min-height:48px;padding:12px 0;cursor:pointer">Tasks · '+tasks.length+' · Tap to expand</summary>'+tasks.map(function(x){var state=S.done[ds+'|'+x.p.id+'|'+x.t.id];return '<div class="li">'+esc(x.p.e)+' '+esc(x.p.n)+': '+esc(x.t.t)+(x.t.due?' · '+niceTime(x.t.due):'')+'<span class="note">'+(state==='a'?' · Done':state==='p'?' · Waiting for approval':'')+'</span></div>';}).join('')+'</details>':'';}
function timelineLayout(events){
  var entries=events.map(function(e){var start=minuteOf(e.m);return {e:e,start:start,finish:Math.max(e.end?endMin(e):start+30,start+75),lane:0};}),ends=[],max=0;
  entries.forEach(function(x){var lane=0;while(lane<ends.length&&ends[lane]>x.start)lane++;x.lane=lane;ends[lane]=x.finish;max=Math.max(max,lane+1);});
  return {entries:entries,lanes:max};
}
function timeDay(ds){
  var all=evOn(ds),timed=all.filter(function(e){return !!e.m;}),layout=timelineLayout(timed);
  if(layout.lanes>2)return '<p class="calendar-help">Many events close together: showing full details so each one stays readable.</p>'+dayAgenda(ds);
  var lo=420,hi=1320;layout.entries.forEach(function(x){lo=Math.min(lo,Math.floor(x.start/60)*60);hi=Math.max(hi,Math.ceil(x.finish/60)*60);});hi=Math.min(hi,1515);
  var hiddenCount=0,canHide=false,earlierBtn='';
  if(ds===today()){
    var nw=new Date(),nowM=nw.getHours()*60+nw.getMinutes(),cut=Math.floor(nowM/60)*60,auto=Math.min(cut,hi-60);
    layout.entries.forEach(function(x){var re=x.e.end?endMin(x.e):x.start+30;if(re>cut&&x.start<auto)auto=Math.floor(x.start/60)*60;});
    hi=Math.max(hi,Math.min(cut+60,1515));
    if(auto>lo){canHide=true;layout.entries.forEach(function(x){var re=x.e.end?endMin(x.e):x.start+30;if(re<=auto)hiddenCount++;});if(!gridEarlier[ds])lo=auto;}
    if(canHide)earlierBtn='<button class="btn n" data-a="nxearlier" data-day="'+ds+'">'+(gridEarlier[ds]?'Hide earlier hours':'Show earlier hours'+(hiddenCount?' ('+hiddenCount+' earlier event'+(hiddenCount>1?'s':'')+')':''))+'</button>';
  }
  var h='<h2>'+dayHeading(ds)+'</h2>'+dayConflictSummary(ds)+'<div class="card all-day-band"><b>All day</b>'+ (all.filter(function(e){return !e.m;}).map(calendarEvent).join('')||'<p class="note">No all-day plans.</p>')+'</div><p class="calendar-help">Times run down the page. Short blocks are enlarged for touch; exact times are printed.</p>'+earlierBtn+'<div class="time-track" style="height:'+(hi-lo)+'px">';
  for(var m=lo;m<hi;m+=60)h+='<div class="time-rule" style="top:'+(m-lo)+'px"><span>'+niceTime(p2(Math.floor(m/60)%24)+':00')+'</span></div>';
  layout.entries.forEach(function(x){var e=x.e,width=100/(layout.lanes||1),realEnd=e.end?endMin(e):x.start+30;if(realEnd<=lo)return;var top0=Math.max(0,x.start-lo),ht0=x.finish-Math.max(x.start,lo)-3;h+='<button class="time-event" data-a="nxevent" data-id="'+e.series+'" data-day="'+(e.origin||ds)+'" style="top:'+top0+'px;height:'+ht0+'px;left:'+(x.lane*width)+'%;width:'+width+'%;border-color:'+eventColor(e)+'"><b>'+niceTime(e.m)+(e.end?' – '+niceTime(e.end):'')+'</b>'+kindIcon(e.kind)+esc(e.t)+(e.cont?' (continued)':'')+'<br><small>'+esc(eventNames(e))+'</small></button>';});
  var n=new Date(),minute=n.getHours()*60+n.getMinutes();if(ds===today()&&minute>=lo&&minute<hi)h+='<div class="now-rule" data-low="'+lo+'" style="top:'+(minute-lo)+'px"><span>Now</span></div>';
  return h+'</div>'+scheduledTasks(ds);
}

var memberEdit='';
function validMembers(list){
  if(!Array.isArray(list)||!list.length||list.length>100)return false;
  var ids={},adult=false;
  return list.every(function(p){
    if(!p||typeof p.id!=='string'||!(/^[A-Za-z0-9_-]{1,100}$/).test(p.id)||['__proto__','constructor','prototype'].indexOf(p.id)>=0||ids[p.id]||typeof p.n!=='string'||!p.n.trim()||p.n.length>60||typeof p.e!=='string'||p.e.length>16||!(/^#[0-9a-fA-F]{6}$/).test(p.c)||(p.kid!==0&&p.kid!==1)||(p.pet!==undefined&&p.pet!==0&&p.pet!==1)||(p.kid&&p.pet)||(p.archived!==undefined&&typeof p.archived!=='boolean'))return false;
    ids[p.id]=true;if(!p.kid&&!p.pet&&!p.archived)adult=true;return true;
  })&&adult;
}
function normalizeMembers(){
  if(!S.members)S.members=JSON.parse(JSON.stringify(defaultMembers));
  P=S.members.filter(function(p){return !p.archived;});
  S.members.forEach(function(p){if(!S.tasks[p.id])S.tasks[p.id]=[];});
}
function membersHtml(){
  var h="<h2>People &amp; pets</h2><div class='card'><p>Add adults, children, and pets to your household. Pets have care checklists; children can earn points.</p>";
  S.members.forEach(function(p){h+="<div class='row'><span class='dot' style='background:"+p.c+"'></span><span class='t'>"+esc(p.e)+' '+esc(p.n)+" <span class='note'>"+(p.pet?'Pet':p.kid?'Child':'Adult')+(p.archived?' · Removed':'')+"</span></span>"+(p.archived?"<button class='btn n' data-a='memberrestore' data-id='"+p.id+"'>Restore</button>":"<button class='btn n' data-a='memberedit' data-id='"+p.id+"'>Edit</button><button class='btn r' data-a='memberremove' data-id='"+p.id+"'>Remove</button>")+"</div>";});
  var p=memberEdit?person(memberEdit):null;
  h+="<h3>"+(p?'Edit member':'Add a person or pet')+"</h3><label for='membername'>Name</label><input id='membername' maxlength='60' value='"+esc(p?p.n:'')+"'><label for='membertype'>Type</label><select id='membertype'"+(p?' disabled':'')+"><option value='adult'"+(p&&!p.kid&&!p.pet?' selected':'')+">Adult</option><option value='child'"+(p&&p.kid?' selected':'')+">Child</option><option value='pet'"+(p&&p.pet?' selected':'')+">Pet</option></select><label for='memberemoji'>Icon (emoji)</label><input id='memberemoji' maxlength='16' value='"+esc(p?p.e:'')+"' placeholder='👤 or 🐾'><label for='membercolor'>Calendar color</label><input id='membercolor' type='color' value='"+(p?p.c:'#4666cc')+"' style='height:48px;width:90px'><button class='btn g' data-a='membersave'>"+(p?'Save member':'Add member')+"</button>"+(p?"<button class='btn n' data-a='membercancel'>Cancel edit</button>":'')+"<p class='note'>Remove hides a member from everyday cards and new assignments. Existing events, reminders, tasks, and points are kept. Restore brings the member back. At least one adult must remain. Type stays fixed to protect point history.</p></div>";
  return h;
}
function memberAction(a,b){
  if(!unlocked)return;
  var id=b.getAttribute('data-id'),p=person(id);
  if(a==='memberedit'){if(p&&!p.archived)memberEdit=id;render();return;}
  if(a==='membercancel'){memberEdit='';render();return;}
  var previous=JSON.parse(JSON.stringify(S));
  if(a==='membersave'){
    var name=v('membername'),type=v('membertype'),color=v('membercolor'),emoji=v('memberemoji');
    if(!name||name.length>60||emoji.length>16||!(/^#[0-9a-fA-F]{6}$/).test(color)||['adult','child','pet'].indexOf(type)<0){alert('Enter a name, type, and valid color.');return;}
    if(memberEdit){p=person(memberEdit);if(!p||p.archived)return;}
    else {if(S.members.length>=100){alert('This hub supports up to 100 members, including removed members.');return;}p={id:'m-'+uid(),kid:type==='child'?1:0,pet:type==='pet'?1:0};S.members.push(p);S.tasks[p.id]=[];}
    p.n=name;p.e=emoji||(p.pet?'🐾':p.kid?'⭐':'👤');p.c=color;
  }else if(a==='memberremove'){
    if(!p||p.archived)return;
    if(!p.kid&&!p.pet&&P.filter(function(x){return !x.kid&&!x.pet;}).length<=1){alert('Keep at least one adult in the household.');return;}
    if(!confirm('Remove '+p.n+' from everyday cards? Their events, reminders, tasks, and points will be kept. You can restore them here.'))return;
    p.archived=true;
  }else if(a==='memberrestore'){if(!p)return;p.archived=false;}else return;
  normalizeMembers();
  if(!save()){S=previous;normalizeMembers();return;}
  memberEdit='';calP='';taskEdit=null;render();
}
